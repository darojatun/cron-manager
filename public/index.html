<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1226">
<title>BlueMatrix Scheduler</title>
<style>
:root{
  --bg:#070d1d; --bg2:#0c1630; --card:rgba(255,255,255,.045); --card-b:rgba(255,255,255,.09);
  --text:#e8eefc; --muted:#8fa0c4; --accent:#3b82f6; --accent2:#22d3ee;
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --radius:16px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--text);
  background:
    radial-gradient(900px 500px at 10% -10%, rgba(59,130,246,.22), transparent 60%),
    radial-gradient(700px 500px at 100% 0%, rgba(34,211,238,.14), transparent 60%),
    var(--bg);
  background-attachment:fixed; min-height:100vh;
  padding:env(safe-area-inset-top) 0 40px;
}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;padding:22px 0 14px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 24px rgba(59,130,246,.45)}
.logo svg{width:24px;height:24px;stroke:#fff}
.brand h1{font-size:19px;margin:0;letter-spacing:.2px}
.brand small{color:var(--muted);display:block;font-size:12px;margin-top:-2px}
.clock{text-align:right}
.clock .t{font:600 22px var(--mono);letter-spacing:1px}
.clock .d{color:var(--muted);font-size:12px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 16px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:99px;font-size:12.5px;
  background:var(--card);border:1px solid var(--card-b);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.bad{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.banner{border:1px solid rgba(251,191,36,.35);background:rgba(251,191,36,.08);color:#fde7a6;
  border-radius:12px;padding:11px 14px;margin-bottom:14px;font-size:13.5px}
.banner.bad{border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.08);color:#fecaca}
.banner code{background:rgba(0,0,0,.3);padding:1px 6px;border-radius:6px;font-family:var(--mono);font-size:12.5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--card-b);border-radius:var(--radius);padding:14px 16px}
.stat b{display:block;font-size:26px;line-height:1.1}
.stat span{color:var(--muted);font-size:12.5px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.search{flex:1;min-width:180px;position:relative}
.search input{padding-left:38px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--muted)}
input,textarea,select{
  width:100%;background:rgba(8,14,32,.75);color:var(--text);border:1px solid var(--card-b);border-radius:12px;
  padding:10px 13px;font:inherit;outline:none;transition:border .15s, box-shadow .15s}
input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.22)}
textarea{font-family:var(--mono);font-size:13px;min-height:120px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--card-b);background:var(--card);
  color:var(--text);padding:9px 14px;border-radius:12px;cursor:pointer;font:inherit;font-size:14px;transition:.15s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.09)}
.btn svg{width:16px;height:16px;stroke:currentColor;flex:none}
.btn.primary{background:linear-gradient(135deg,var(--accent),#2563eb);border-color:transparent;font-weight:600;
  box-shadow:0 6px 20px rgba(59,130,246,.35)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger:hover{background:rgba(248,113,113,.15);border-color:rgba(248,113,113,.4);color:#fecaca}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.job{background:var(--card);border:1px solid var(--card-b);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px;
  backdrop-filter:blur(6px);transition:transform .15s,border-color .15s}
.job:hover{border-color:rgba(59,130,246,.45);transform:translateY(-2px)}
.job.off{opacity:.62}
.job .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.job h3{margin:0;font-size:16px;word-break:break-word}
.sched{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sched code{font-family:var(--mono);background:rgba(59,130,246,.15);color:#9cc2ff;padding:3px 9px;border-radius:8px;font-size:13px}
.human{color:var(--muted);font-size:13px}
.next{font-size:13px;color:var(--accent2);display:flex;align-items:center;gap:6px}
.next svg{width:15px;height:15px;stroke:currentColor}
.next.off{color:var(--muted)}
pre.cmd{margin:0;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:9px 11px;
  font:12.5px/1.45 var(--mono);color:#c7d5f5;max-height:76px;overflow:hidden;white-space:pre-wrap;word-break:break-all}
.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px}
.actions .sp{flex:1}
.switch{position:relative;width:44px;height:25px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:#2a3556;border-radius:99px;cursor:pointer;transition:.2s}
.switch span:before{content:"";position:absolute;width:19px;height:19px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+span{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.switch input:checked+span:before{transform:translateX(19px)}
.empty{text-align:center;color:var(--muted);padding:50px 10px;border:1px dashed var(--card-b);border-radius:var(--radius)}
.empty svg{width:46px;height:46px;stroke:var(--muted);margin-bottom:8px}
.modal{position:fixed;inset:0;background:rgba(3,7,18,.72);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:14px;z-index:50}
.modal.open{display:flex}
.sheet{width:100%;max-width:640px;max-height:92vh;overflow:auto;background:linear-gradient(180deg,#0f1b3a,#0b1430);
  border:1px solid var(--card-b);border-radius:20px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.sheet.wide{max-width:860px}
.sheet h2{margin:0 0 14px;font-size:18px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{padding:4px 10px;border-radius:99px;border:1px solid var(--card-b);background:var(--card);color:var(--muted);font-size:12px;cursor:pointer}
.chip:hover{color:var(--text);border-color:var(--accent)}
.preview{margin-top:8px;font-size:13px;background:rgba(34,211,238,.07);border:1px solid rgba(34,211,238,.2);border-radius:10px;padding:8px 11px;color:#a5eaf6}
.preview.err{background:rgba(248,113,113,.08);border-color:rgba(248,113,113,.3);color:#fecaca}
.preview ul{margin:4px 0 0;padding-left:18px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.foot{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
pre.log{background:#050a18;border:1px solid var(--card-b);border-radius:12px;padding:12px;height:52vh;overflow:auto;
  font:12.5px/1.5 var(--mono);color:#b6f3c9;white-space:pre-wrap;word-break:break-all;margin:0 0 12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);opacity:0;pointer-events:none;
  background:#16264f;border:1px solid var(--card-b);padding:10px 16px;border-radius:12px;z-index:99;transition:.25s;max-width:90vw;font-size:14px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:#4a1d24;border-color:rgba(248,113,113,.5)}
.check{display:flex;align-items:center;gap:9px;font-size:14px}
.check input{width:auto}
footer{color:var(--muted);text-align:center;font-size:12px;margin-top:30px}
@media(max-width:560px){
  .stats b{font-size:21px}.clock .t{font-size:18px}.grid{grid-template-columns:1fr}
  .btn.label-hide span{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
      <div><h1>BlueMatrix Scheduler</h1><small id="host">OpenStick cron manager</small></div>
    </div>
    <div class="clock"><div class="t" id="clk">--:--:--</div><div class="d" id="clkd">memuat…</div></div>
  </header>

  <div class="pills" id="pills"></div>
  <div id="banners"></div>

  <div class="stats">
    <div class="stat"><b id="sTotal">0</b><span>Total job</span></div>
    <div class="stat"><b id="sOn" style="color:var(--ok)">0</b><span>Aktif</span></div>
    <div class="stat"><b id="sOff" style="color:var(--warn)">0</b><span>Dijeda</span></div>
  </div>

  <div class="toolbar">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="Cari job…" autocomplete="off">
    </div>
    <button class="btn" id="btnRaw"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-6-6-6M12 19h8"/></svg><span>Crontab</span></button>
    <button class="btn" id="btnSync"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg><span>Sinkron</span></button>
    <button class="btn primary" id="btnNew"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Job baru</button>
  </div>

  <div class="grid" id="grid"></div>
  <footer>BlueMatrix Scheduler · jadwal berjalan memakai cron sistem, tetap aktif walau aplikasi ini dimatikan</footer>
</div>

<!-- Modal job -->
<div class="modal" id="mJob"><div class="sheet">
  <h2 id="mJobTitle">Job baru</h2>
  <div class="field"><label>Nama job</label><input id="fName" maxlength="80" placeholder="mis. Keep-alive koneksi"></div>
  <div class="field">
    <label>Jadwal cron (menit jam tanggal bulan hari) atau @reboot</label>
    <input id="fSched" placeholder="*/5 * * * *" spellcheck="false" style="font-family:var(--mono)">
    <div class="chips" id="presets"></div>
    <div class="preview" id="schedPrev"></div>
  </div>
  <div class="field">
    <label>Perintah shell</label>
    <textarea id="fCmd" spellcheck="false" placeholder="ping -c 1 8.8.8.8 > /dev/null"></textarea>
    <div class="chips" id="snips"></div>
  </div>
  <div class="row">
    <label class="check"><input type="checkbox" id="fEnabled" checked> Aktifkan job</label>
    <div class="foot" style="margin:0">
      <button class="btn" data-close>Batal</button>
      <button class="btn primary" id="btnSave">Simpan</button>
    </div>
  </div>
</div></div>

<!-- Modal log -->
<div class="modal" id="mLog"><div class="sheet wide">
  <div class="row" style="margin-bottom:10px"><h2 id="logTitle" style="margin:0">Log</h2><span class="human" id="logSize"></span></div>
  <pre class="log" id="logBody">memuat…</pre>
  <div class="row">
    <label class="check"><input type="checkbox" id="logAuto" checked> Muat ulang otomatis</label>
    <div class="foot" style="margin:0">
      <button class="btn danger" id="btnLogClear">Kosongkan</button>
      <button class="btn" id="btnLogRef">Muat ulang</button>
      <button class="btn primary" data-close>Tutup</button>
    </div>
  </div>
</div></div>

<!-- Modal crontab mentah -->
<div class="modal" id="mRaw"><div class="sheet wide">
  <h2>Isi crontab saat ini</h2>
  <pre class="log" id="rawBody" style="color:#c7d5f5"></pre>
  <div class="foot"><button class="btn primary" data-close>Tutup</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var jobs=[], status={}, editingId=null, logId=null, logTimer=null, skew=0, query='';

var ICON={
  play:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4l13 8-13 8z"/></svg>',
  log:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  empty:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>'
};

/* ---------- util ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return n<10?'0'+n:''+n}
function toast(msg,err){var t=$('#toast');t.textContent=msg;t.className='toast show'+(err?' err':'');clearTimeout(toast.h);toast.h=setTimeout(function(){t.className='toast'},err?5000:2600)}
function api(path,opts){
  opts=opts||{};
  opts.headers={'Content-Type':'application/json'};
  opts.credentials='same-origin';
  return fetch(path,opts).then(function(r){
    if(r.status===401){location.reload();throw new Error('Sesi berakhir')}
    return r.json().catch(function(){return {}}).then(function(j){if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j});
  });
}
function bytes(n){return n<1024?n+' B':(n/1024).toFixed(1)+' KB'}

/* ---------- parser cron ---------- */
var MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
var DOW={sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6};
var SPECIAL={'@hourly':'0 * * * *','@daily':'0 0 * * *','@midnight':'0 0 * * *','@weekly':'0 0 * * 0','@monthly':'0 0 1 * *','@yearly':'0 0 1 1 *','@annually':'0 0 1 1 *'};
function parseField(f,min,max,names){
  var set={},parts=f.split(',');
  for(var k=0;k<parts.length;k++){
    var m=/^([^\/]+)(?:\/(\d+))?$/.exec(parts[k]); if(!m)return null;
    var step=m[2]?parseInt(m[2],10):1; if(step<1)return null;
    var a,b;
    if(m[1]==='*'){a=min;b=max}
    else{
      var ends=m[1].split('-'); if(ends.length>2)return null;
      var conv=function(x){var key=x.toLowerCase(); if(names&&names[key]!==undefined)return names[key]; return /^\d+$/.test(x)?parseInt(x,10):NaN};
      a=conv(ends[0]); b=ends.length===2?conv(ends[1]):(m[2]?max:a);
      if(isNaN(a)||isNaN(b)||a<min||b>max||a>b)return null;
    }
    for(var i=a;i<=b;i+=step)set[i]=1;
  }
  return set;
}
function expand(e){e=e.trim().replace(/\s+/g,' ');return SPECIAL[e]||e}
function parseCron(expr){
  var e=expr.trim().replace(/\s+/g,' ');
  if(e==='@reboot')return {reboot:true};
  var p=expand(e).split(' '); if(p.length!==5)return null;
  var min=parseField(p[0],0,59),hour=parseField(p[1],0,23),dom=parseField(p[2],1,31),mon=parseField(p[3],1,12,MON),dw=parseField(p[4],0,7,DOW);
  if(!min||!hour||!dom||!mon||!dw)return null;
  if(dw[7]){dw[0]=1;delete dw[7]}
  return {min:min,hour:hour,dom:dom,mon:mon,dow:dw,domR:p[2]!=='*',dowR:p[4]!=='*'};
}
function wallNow(){return new Date(Date.now()+skew+(status.tzOffset||0)*60000)}
function nextRuns(expr,n){
  var c=parseCron(expr); if(!c||c.reboot)return [];
  var t=new Date(Math.floor(wallNow().getTime()/60000)*60000+60000), out=[], guard=0;
  while(out.length<n&&guard++<600000){
    var M=t.getUTCMonth()+1,D=t.getUTCDate(),W=t.getUTCDay();
    var dayOk=(c.domR&&c.dowR)?(c.dom[D]||c.dow[W]):(c.dom[D]&&c.dow[W]);
    if(!c.mon[M]||!dayOk){t=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth(),t.getUTCDate()+1));continue}
    if(!c.hour[t.getUTCHours()]){t=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth(),t.getUTCDate(),t.getUTCHours()+1));continue}
    if(c.min[t.getUTCMinutes()])out.push(new Date(t));
    t=new Date(t.getTime()+60000);
  }
  return out;
}
var MONTHS=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
var DAYS=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
function fmtWall(d){
  var y=d.getUTCFullYear()!==wallNow().getUTCFullYear()?' '+d.getUTCFullYear():'';
  return d.getUTCDate()+' '+MONTHS[d.getUTCMonth()]+y+' '+pad(d.getUTCHours())+':'+pad(d.getUTCMinutes());
}
function rel(d){
  var mins=Math.round((d.getTime()-wallNow().getTime())/60000);
  if(mins<=1)return 'sebentar lagi';
  if(mins<60)return 'dalam '+mins+' mnt';
  var h=Math.floor(mins/60),m=mins%60;
  if(h<24)return 'dalam '+h+' j'+(m?' '+m+' mnt':'');
  return 'dalam '+Math.floor(h/24)+' hr '+(h%24)+' j';
}
function describe(expr){
  var e=expr.trim().replace(/\s+/g,' ');
  if(e==='@reboot')return 'Sekali saat sistem boot';
  var p=expand(e).split(' '); if(p.length!==5)return '';
  var m=p[0],h=p[1],dom=p[2],mon=p[3],dow=p[4],num=function(x){return /^\d+$/.test(x)};
  var hhmm=function(){return pad(+h)+':'+pad(+m)};
  if(p.join(' ')==='* * * * *')return 'Setiap menit';
  if(/^\*\/\d+$/.test(m)&&h==='*'&&dom==='*'&&mon==='*'&&dow==='*')return 'Setiap '+m.slice(2)+' menit';
  if(num(m)&&h==='*'&&dom==='*'&&mon==='*'&&dow==='*')return 'Setiap jam pada menit ke-'+m;
  if(num(m)&&/^\*\/\d+$/.test(h)&&dom==='*'&&mon==='*'&&dow==='*')return 'Setiap '+h.slice(2)+' jam (menit ke-'+m+')';
  if(num(m)&&num(h)&&mon==='*'){
    if(dom==='*'&&dow==='*')return 'Setiap hari pukul '+hhmm();
    if(dom==='*'&&num(dow))return 'Setiap '+DAYS[+dow%7]+' pukul '+hhmm();
    if(dow==='*'&&num(dom))return 'Setiap tanggal '+dom+' pukul '+hhmm();
  }
  return 'Jadwal kustom';
}

/* ---------- render ---------- */
function setClock(){
  if(!status.serverNow)return;
  var w=wallNow();
  $('#clk').textContent=pad(w.getUTCHours())+':'+pad(w.getUTCMinutes())+':'+pad(w.getUTCSeconds());
  var off=status.tzOffset||0,sign=off>=0?'+':'-',a=Math.abs(off);
  $('#clkd').textContent=DAYS[w.getUTCDay()]+', '+w.getUTCDate()+' '+MONTHS[w.getUTCMonth()]+' '+w.getUTCFullYear()+' · UTC'+sign+pad(Math.floor(a/60))+':'+pad(a%60)+(status.tzName?' ('+status.tzName+')':'');
}
function renderStatus(){
  var s=status; if(!s.serverNow)return;
  $('#host').textContent=(s.hostname||'openstick')+' · '+(s.user||'');
  var up=Math.floor(s.uptime/3600), upm=Math.floor(s.uptime%3600/60);
  $('#pills').innerHTML=
    '<span class="pill"><i class="dot '+(s.cronRunning?'ok':'bad')+'"></i>cron '+(s.cronRunning===null?'tidak diketahui':s.cronRunning?'berjalan':'tidak berjalan')+'</span>'+
    '<span class="pill">Uptime '+up+' j '+upm+' m</span>'+
    '<span class="pill">Load '+(s.load||0).toFixed(2)+'</span>'+
    '<span class="pill">Node '+esc(s.node||'')+'</span>';
  var b='';
  if(!s.crontabAvailable)b+='<div class="banner bad"><b>Perintah <code>crontab</code> tidak ditemukan.</b> Install dulu: <code>apt install cron</code> (Debian) atau <code>opkg install cronie</code>. Job tersimpan tetapi belum bisa berjalan.</div>';
  else if(s.cronRunning===false)b+='<div class="banner bad"><b>Daemon cron tidak berjalan.</b> Jalankan: <code>systemctl enable --now cron</code> (atau <code>service cron start</code> / <code>crond -b</code> untuk busybox).</div>';
  if(s.serverNow&&Math.abs(s.serverNow-Date.now())>5*60000)b+='<div class="banner">Jam perangkat berbeda dari jam browser lebih dari 5 menit. Pastikan waktu OpenStick benar (mis. <code>timedatectl set-ntp true</code>), karena cron mengikuti jam perangkat.</div>';
  $('#banners').innerHTML=b;
  setClock();
}
function render(){
  var on=jobs.filter(function(j){return j.enabled}).length;
  $('#sTotal').textContent=jobs.length;$('#sOn').textContent=on;$('#sOff').textContent=jobs.length-on;
  var q=query.toLowerCase();
  var list=jobs.filter(function(j){return !q||(j.name+' '+j.command+' '+j.schedule).toLowerCase().indexOf(q)!==-1});
  if(!list.length){
    $('#grid').innerHTML='<div class="empty" style="grid-column:1/-1">'+ICON.empty+'<div>'+(jobs.length?'Tidak ada job yang cocok.':'Belum ada job. Klik <b>Job baru</b> untuk membuat jadwal pertama.')+'</div></div>';
    return;
  }
  $('#grid').innerHTML=list.map(function(j){
    var nr=j.enabled?nextRuns(j.schedule,1)[0]:null, nxt;
    if(!j.enabled)nxt='<div class="next off">'+ICON.clock+'Dijeda</div>';
    else if(j.schedule.trim()==='@reboot')nxt='<div class="next">'+ICON.clock+'Dijalankan saat boot</div>';
    else nxt='<div class="next">'+ICON.clock+(nr?'Berikutnya '+fmtWall(nr)+' ('+rel(nr)+')':'—')+'</div>';
    return '<div class="job'+(j.enabled?'':' off')+'" data-id="'+j.id+'">'+
      '<div class="top"><h3>'+esc(j.name)+'</h3><label class="switch" title="Aktif/jeda"><input type="checkbox" data-act="toggle" '+(j.enabled?'checked':'')+'><span></span></label></div>'+
      '<div class="sched"><code>'+esc(j.schedule)+'</code><span class="human">'+esc(describe(j.schedule))+'</span></div>'+nxt+
      '<pre class="cmd">'+esc(j.command)+'</pre>'+
      '<div class="actions">'+
        '<button class="btn sm" data-act="run">'+ICON.play+'Jalankan</button>'+
        '<button class="btn sm" data-act="log">'+ICON.log+'Log'+(j.logSize?' <small style="color:var(--muted)">'+bytes(j.logSize)+'</small>':'')+'</button>'+
        '<span class="sp"></span>'+
        '<button class="btn sm" data-act="edit" title="Edit">'+ICON.edit+'</button>'+
        '<button class="btn sm danger" data-act="del" title="Hapus">'+ICON.trash+'</button>'+
      '</div></div>';
  }).join('');
}

/* ---------- data ---------- */
function loadStatus(){
  return api('/api/status').then(function(s){status=s;skew=s.serverNow-Date.now();renderStatus()}).catch(function(e){toast(e.message,true)});
}
function loadJobs(){
  return api('/api/jobs').then(function(r){jobs=r.jobs;render()}).catch(function(e){toast(e.message,true)});
}
function refresh(){return loadStatus().then(loadJobs)}
function afterWrite(r,okMsg){
  if(r&&r.synced===false)toast('Tersimpan, tetapi crontab gagal: '+r.warning,true);else toast(okMsg);
  return refresh();
}

/* ---------- modal ---------- */
function open(id){$(id).classList.add('open')}
function closeAll(){
  [].forEach.call(document.querySelectorAll('.modal'),function(m){m.classList.remove('open')});
  clearInterval(logTimer);logTimer=null;logId=null;
}
document.addEventListener('click',function(e){
  if(e.target.closest('[data-close]'))closeAll();
  else if(e.target.classList&&e.target.classList.contains('modal'))closeAll();
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeAll()});

var PRESETS=[['Tiap menit','* * * * *'],['Tiap 5 menit','*/5 * * * *'],['Tiap 15 menit','*/15 * * * *'],['Tiap jam','0 * * * *'],
  ['Tiap 6 jam','0 */6 * * *'],['Harian 00:00','0 0 * * *'],['Harian 03:00','0 3 * * *'],['Mingguan (Min)','0 0 * * 0'],['Bulanan','0 0 1 * *'],['Saat boot','@reboot']];
var SNIPS=[['Reboot','reboot'],['Ping keep-alive','ping -c 1 -W 5 8.8.8.8 >/dev/null || echo "koneksi putus"'],['Bersihkan cache RAM','sync; echo 3 > /proc/sys/vm/drop_caches'],['Info suhu','cat /sys/class/thermal/thermal_zone*/temp']];
$('#presets').innerHTML=PRESETS.map(function(p,i){return '<span class="chip" data-p="'+i+'">'+p[0]+'</span>'}).join('');
$('#snips').innerHTML='<span class="human" style="align-self:center">Contoh:</span>'+SNIPS.map(function(p,i){return '<span class="chip" data-s="'+i+'">'+p[0]+'</span>'}).join('');
$('#presets').addEventListener('click',function(e){var c=e.target.closest('[data-p]');if(!c)return;$('#fSched').value=PRESETS[c.dataset.p][1];prev()});
$('#snips').addEventListener('click',function(e){var c=e.target.closest('[data-s]');if(!c)return;$('#fCmd').value=SNIPS[c.dataset.s][1]});

function prev(){
  var v=$('#fSched').value, box=$('#schedPrev');
  if(!v.trim()){box.className='preview';box.innerHTML='Isi jadwal, mis. <code>*/10 * * * *</code>';return}
  var c=parseCron(v);
  if(!c){box.className='preview err';box.textContent='Format jadwal tidak valid.';return}
  var h='<b>'+esc(describe(v))+'</b>';
  if(c.reboot)h+='';
  else{var n=nextRuns(v,3);h+='<ul>'+n.map(function(d){return '<li>'+fmtWall(d)+' <span style="opacity:.7">('+rel(d)+')</span></li>'}).join('')+'</ul>'}
  box.className='preview';box.innerHTML=h;
}
$('#fSched').addEventListener('input',prev);

function openJob(job){
  editingId=job?job.id:null;
  $('#mJobTitle').textContent=job?'Edit job':'Job baru';
  $('#fName').value=job?job.name:'';
  $('#fSched').value=job?job.schedule:'*/5 * * * *';
  $('#fCmd').value=job?job.command:'';
  $('#fEnabled').checked=job?job.enabled:true;
  prev();open('#mJob');setTimeout(function(){$('#fName').focus()},50);
}
$('#btnNew').onclick=function(){openJob(null)};
$('#btnSave').onclick=function(){
  var body={name:$('#fName').value.trim(),schedule:$('#fSched').value.trim(),command:$('#fCmd').value,enabled:$('#fEnabled').checked};
  if(!body.name)return toast('Nama job wajib diisi',true);
  if(!parseCron(body.schedule))return toast('Format jadwal tidak valid',true);
  if(!body.command.trim())return toast('Perintah wajib diisi',true);
  var btn=$('#btnSave');btn.disabled=true;
  api(editingId?'/api/jobs/'+editingId:'/api/jobs',{method:editingId?'PUT':'POST',body:JSON.stringify(body)})
    .then(function(r){closeAll();return afterWrite(r,'Job tersimpan')})
    .catch(function(e){toast(e.message,true)}).then(function(){btn.disabled=false});
};

/* ---------- aksi job ---------- */
$('#grid').addEventListener('click',function(e){
  var t=e.target.closest('[data-act]'); if(!t)return;
  var card=t.closest('.job'); var id=card.dataset.id, job=jobs.filter(function(j){return j.id===id})[0]; if(!job)return;
  var act=t.dataset.act;
  if(act==='toggle'){
    api('/api/jobs/'+id+'/toggle',{method:'POST',body:'{}'}).then(function(r){return afterWrite(r,r.job&&r.job.enabled?'Job diaktifkan':'Job dijeda')}).catch(function(e){toast(e.message,true);refresh()});
  }else if(act==='run'){
    if(!confirm('Jalankan "'+job.name+'" sekarang?'))return;
    api('/api/jobs/'+id+'/run',{method:'POST',body:'{}'}).then(function(){toast('Job dijalankan, membuka log…');openLog(job)}).catch(function(e){toast(e.message,true)});
  }else if(act==='log'){openLog(job)}
  else if(act==='edit'){openJob(job)}
  else if(act==='del'){
    if(!confirm('Hapus job "'+job.name+'"? Log-nya ikut dihapus.'))return;
    api('/api/jobs/'+id,{method:'DELETE'}).then(function(r){return afterWrite(r,'Job dihapus')}).catch(function(e){toast(e.message,true)});
  }
});

/* ---------- log ---------- */
function fetchLog(){
  if(!logId)return;
  api('/api/jobs/'+logId+'/log').then(function(r){
    var el=$('#logBody'),atBottom=el.scrollHeight-el.scrollTop-el.clientHeight<40;
    el.textContent=r.log||'(log masih kosong — belum pernah berjalan)';
    $('#logSize').textContent=bytes(r.size);
    if(atBottom)el.scrollTop=el.scrollHeight;
  }).catch(function(){});
}
function openLog(job){
  logId=job.id;$('#logTitle').textContent='Log · '+job.name;$('#logBody').textContent='memuat…';open('#mLog');
  fetchLog();setTimeout(function(){var el=$('#logBody');el.scrollTop=el.scrollHeight},300);
  clearInterval(logTimer);
  logTimer=setInterval(function(){if($('#logAuto').checked)fetchLog()},3000);
}
$('#btnLogRef').onclick=fetchLog;
$('#btnLogClear').onclick=function(){
  if(!logId||!confirm('Kosongkan log job ini?'))return;
  api('/api/jobs/'+logId+'/log',{method:'DELETE'}).then(function(){fetchLog();loadJobs()});
};

/* ---------- lain-lain ---------- */
$('#btnRaw').onclick=function(){
  loadStatus().then(function(){$('#rawBody').textContent=status.crontab||'(crontab kosong)';open('#mRaw')});
};
$('#btnSync').onclick=function(){
  api('/api/sync',{method:'POST',body:'{}'}).then(function(r){return afterWrite(r,'Crontab disinkronkan')}).catch(function(e){toast(e.message,true)});
};
$('#q').addEventListener('input',function(){query=this.value;render()});

refresh();
setInterval(setClock,1000);
setInterval(function(){if(!document.hidden)refresh()},30000);
})();
</script>
</body>
</html>
